  <rect x="112" y="78" width="110" height="5" fill="#9a9db0"/>
  <!-- Chispas -->
  <g stroke="url(#ember)" stroke-width="4" stroke-linecap="round">
    <line x1="170" y1="66" x2="182" y2="44"/>
    <line x1="160" y1="64" x2="152" y2="38"/>
    <line x1="182" y1="70" x2="206" y2="56"/>
    <line x1="146" y1="68" x2="126" y2="52"/>
