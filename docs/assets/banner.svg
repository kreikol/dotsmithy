      <stop offset="1" stop-color="#ff8c42" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="200" rx="16" fill="url(#bg)"/>
  <!-- Resplandor de la forja detrás del yunque -->
  <ellipse cx="150" cy="105" rx="130" ry="80" fill="url(#glow)"/>
  <!-- Yunque -->
  <path d="M42,84 Q80,78 112,78 L222,78 L222,98 L204,98 Q188,104 184,118 L184,138 L204,148 L204,160 L106,160 L106,148 L126,138 L126,118 Q122,104 106,100 Q72,98 42,84 Z"
